<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Deck.gl map</title>
<link rel="stylesheet" href="/lib/maplibre-gl.css"/>
<style>
  html,body,#map{height:100%;margin:0}
  #panel{position:absolute;z-index:1000;top:10px;left:10px;background:rgba(255,255,255,.92);
         padding:10px 14px;border-radius:8px;font:13px/1.5 Segoe UI,sans-serif;box-shadow:0 1px 6px rgba(0,0,0,.3);
         max-width:300px}
  #panel h1{font-size:15px;margin:0 0 4px}
  #tooltip{position:absolute;z-index:1001;background:rgba(0,0,0,.82);color:#fff;padding:6px 9px;
           border-radius:5px;font:12px/1.4 Segoe UI,sans-serif;pointer-events:none;display:none}
</style>
</head>
<body>
<div id="panel">
  <h1 id="title">Deck.gl map</h1>
  <div id="subtitle"><b>Layers:</b> H3 hexagons (POI density) · POI scatterplot</div>
  <div style="margin-top:4px;color:#555">Built with open-source
  <a href="https://deck.gl" target="_blank">Deck.gl</a> + MapLibre + H3.</div>
  <div style="margin-top:8px;border-top:1px solid #ddd;padding-top:6px">
    <a href="/runs.html">&#8592; All maps</a>
  </div>
</div>
<div id="tooltip"></div>
<div id="map"></div>

<script src="/lib/maplibre-gl.js"></script>
<script src="/lib/deck.gl.min.js"></script>
<script>
const { Deck, MapboxOverlay, ScatterplotLayer, GeoJsonLayer } = deck;
const tip = document.getElementById('tooltip');
function showTip(x, y, html) {
  tip.innerHTML = html; tip.style.display = 'block';
  tip.style.left = (x + 12) + 'px'; tip.style.top = (y + 12) + 'px';
}

// ---- run resolution: /deck.html?run=<slug> OR /deck.html (root demo) ------
const params = new URLSearchParams(window.location.search);
const run = params.get('run');
const dataRoot = run ? ('/runs/' + run + '/') : './';
// root demo default = Mount Mitchell; runs carry their own run.json
let CFG = { center: [-82.2651, 35.7649], title: 'Mount Mitchell — Deck.gl', zoom: 12 };

function buildMap() {
  document.getElementById('title').textContent = CFG.title;
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256 } },
      layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
    },
    center: CFG.center,
    zoom: CFG.zoom,
    pitch: 45
  });
  map.addControl(new maplibregl.NavigationControl());
  const overlay = new MapboxOverlay({ interleaved: true });
  map.addControl(overlay);

  Promise.all([
    fetch(dataRoot + 'h3_hexagons.geojson').then(r => r.ok ? r.json() : { features: [] }).catch(() => ({ features: [] })),
    fetch(dataRoot + 'pois.geojson').then(r => r.ok ? r.json() : { features: [] }).catch(() => ({ features: [] }))
  ]).then(([hexFC, poiFC]) => {
    const layers = [
      new GeoJsonLayer({
        id: 'h3-hexagons',
        data: hexFC,
        opacity: 0.55,
        stroked: true,
        filled: true,
        extruded: true,
        wireframe: true,
        getElevation: f => (f.properties.count || 0) * 250,
        getFillColor: f => {
          const c = f.properties.count || 0;
          return c >= 2 ? [230, 57, 70, 220] : [69, 117, 180, 180];
        },
        getLineColor: [255, 255, 255, 140],
        pickable: true,
        onHover: info => {
          if (info.object) {
            const p = info.object.properties;
            const rate = p.mean_rating ? ` \u2605 ${Number(p.mean_rating).toFixed(2)}` : '';
            showTip(info.x, info.y, `<b>${p.count} POI(s)</b>${rate}<br/>${p.category || ''}`);
          } else { tip.style.display = 'none'; }
        }
      }),
      new ScatterplotLayer({
        id: 'poi-points',
        data: poiFC.features || [],
        radiusScale: 20,
        radiusMinPixels: 4,
        getPosition: f => f.geometry.coordinates,
        getFillColor: [255, 165, 0, 230],
        getLineColor: [255, 255, 255, 200],
        lineWidthMinPixels: 1,
        pickable: true,
        onHover: info => {
          if (info.object) {
            const p = info.object.properties;
            const rate = p.rating ? ` \u2605 ${p.rating}` : '';
            showTip(info.x, info.y, `<b>${p.name}</b>${rate}<br/>${p.address || ''}`);
          }
        }
      })
    ];
    overlay.setProps({ layers });
  });
}

// try to load the run's run.json (root demo has none -> defaults above)
fetch(dataRoot + 'run.json').then(r => r.ok ? r.json() : null).catch(() => null).then(cfg => {
  if (cfg) {
    if (cfg.center) CFG.center = cfg.center;
    if (cfg.title) CFG.title = cfg.title;
    if (cfg.zoom) CFG.zoom = cfg.zoom;
  }
  buildMap();
});
</script>
</body>
</html>
