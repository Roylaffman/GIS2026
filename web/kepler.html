<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Mount Mitchell — Kepler.gl demo</title>
<style>
  html,body,#app{height:100%;margin:0}
  #err{position:absolute;z-index:1000;bottom:10px;left:10px;background:#b71c1c;color:#fff;
       padding:8px 12px;border-radius:6px;font:12px/1.5 Segoe UI,sans-serif;display:none;max-width:70%}
</style>
</head>
<body>
<div id="app" style="height:100%"></div>
<div id="err"></div>

<script src="config.js"></script>
<script src="lib/react.production.min.js"></script>
<script src="lib/react-dom.production.min.js"></script>
<script src="lib/redux.min.js"></script>
<script src="lib/react-redux.min.js"></script>
<script src="lib/styled-components.min.js"></script>
<script src="lib/keplergl.min.js"></script>
<script>
(function () {
  function showError(msg) {
    const el = document.getElementById('err');
    el.textContent = 'Kepler.gl error: ' + msg;
    el.style.display = 'block';
  }
  try {
    // ---- resolve the UMD global namespace --------------------------------
    const KG = window.KeplerGl;               // namespace (named + default exports)
    const KeplerGl = KG.default || KG.KeplerGl; // the React component
    const keplerGlReducer = KG.keplerGlReducer;
    const enhanceReduxMiddleware = KG.enhanceReduxMiddleware;
    const addDataToMap = KG.addDataToMap;

    const MAPBOX_TOKEN = (window.DSH_CONFIG && window.DSH_CONFIG.mapboxToken) || '';

    // ---- redux store (required by KeplerGl) ------------------------------
    const { Provider } = ReactRedux;
    const { createStore, combineReducers, applyMiddleware } = Redux;

    const store = createStore(
      combineReducers({ keplerGl: keplerGlReducer }),
      {},
      applyMiddleware(...enhanceReduxMiddleware())
    );

    // ---- root render -----------------------------------------------------
    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(
      React.createElement(Provider, { store },
        React.createElement(KeplerGl, {
          id: 'pois',
          mapboxApiAccessToken: MAPBOX_TOKEN,
          width: window.innerWidth,
          height: window.innerHeight
        })
      )
    );

    // ---- auto-load pois.geojson ------------------------------------------
    fetch('pois.geojson').then(r => {
      if (!r.ok) throw new Error('pois.geojson HTTP ' + r.status);
      return r.json();
    }).then(fc => {
      // build kepler.gl "rows" format; lat/lng columns auto-create a point layer
      const fields = [
        { name: 'name',    type: 'string' },
        { name: 'address', type: 'string' },
        { name: 'rating',  type: 'real' },
        { name: 'ptype',   type: 'string' },
        { name: 'lng',     type: 'real' },
        { name: 'lat',     type: 'real' }
      ];
      const rows = (fc.features || []).map(f => {
        const p = f.properties || {};
        const [lng, lat] = f.geometry.coordinates;
        return [p.name || '', p.address || '', p.rating || 0, p.ptype || '', lng, lat];
      });
      store.dispatch(addDataToMap({
        datasets: {
          info: { label: 'Mount Mitchell POIs', id: 'pois' },
          data: { fields, rows }
        },
        options: { centerMap: true, readOnly: false }
      }));
      document.title = 'Kepler.gl — ' + rows.length + ' POIs';
    }).catch(e => showError(e.message));
  } catch (e) {
    showError((e && e.message) || String(e));
  }
})();
</script>
</body>
</html>
